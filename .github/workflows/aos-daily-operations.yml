name: AOS Daily Operations

on:
  schedule:
    # 06:00 IST (UTC+5:30) every day == 00:30 UTC.
    - cron: "30 0 * * *"
  workflow_dispatch: {}

jobs:
  run-orchestrator:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run AOS Orchestrator
        run: python3 AOS/orchestrator/orchestrator.py

      - name: Commit updated AOS data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add AOS/
          if git diff --cached --quiet; then
            echo "No changes today; nothing to commit."
          else
            git commit -m "AOS Orchestrator: daily run ($(date -u +%F))"
            git push
          fi
